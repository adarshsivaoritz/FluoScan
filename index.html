<!DOCTYPE html>
<html>
<head>
  <base href="/FluoScan/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FluoScan fluorescent barcode reader">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <title>FluoScan</title>

  <!-- ZXing is used only after FluoScan reconstructs a clean black/white barcode. -->
  <script src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>
  <script>
    // v0.2: try both normal and horizontally mirrored images. Some front
    // cameras/webcam drivers present mirrored frames even though the barcode
    // itself is valid. BrowserMultiFormatReader also lets ordinary barcodes
    // act as a sanity check before fluorescence-specific preprocessing.
    window.decodeCode128DataUrl = async function(dataUrl) {
      if (!window.ZXing) return null;

      async function loadImage(src) {
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = src;
        });
        return img;
      }

      async function decodeImage(img) {
        const reader = new ZXing.BrowserMultiFormatReader();
        try {
          const result = await reader.decodeFromImageElement(img);
          if (!result) return null;
          const format = result.getBarcodeFormat ? String(result.getBarcodeFormat()) : "";
          const text = result.getText ? result.getText() : String(result);
          return { text: text, format: format };
        } catch (e) {
          return null;
        } finally {
          try { reader.reset(); } catch (_) {}
        }
      }

      try {
        const img = await loadImage(dataUrl);
        let result = await decodeImage(img);
        if (result) return JSON.stringify(result);

        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext('2d');
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0);
        const mirrored = await loadImage(canvas.toDataURL('image/png'));
        result = await decodeImage(mirrored);
        if (result) {
          result.format = result.format + ' (mirrored input)';
          return JSON.stringify(result);
        }
        return null;
      } catch (e) {
        return null;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
