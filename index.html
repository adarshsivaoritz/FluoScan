<!DOCTYPE html>
<html>
<head>
  <base href="/FluoScan/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FluoScan screen-camera Code 128 reader">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>FluoScan v0.4</title>

  <script src="https://unpkg.com/@zxing/library@0.19.1" type="application/javascript"></script>
  <script>
    // v0.4 assumes the test image is not mirrored. Try Chrome's native
    // Code 128 detector first, then ZXing. Screen-specific reconstruction
    // and checksum validation are implemented in Dart.
    window.decodeCode128DataUrl = async function(dataUrl) {
      async function loadImage(src) {
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = src;
        });
        return img;
      }

      try {
        const img = await loadImage(dataUrl);

        if ('BarcodeDetector' in window) {
          try {
            const supported = await BarcodeDetector.getSupportedFormats();
            if (supported.includes('code_128')) {
              const detector = new BarcodeDetector({formats: ['code_128']});
              const found = await detector.detect(img);
              if (found && found.length) {
                return JSON.stringify({
                  text: found[0].rawValue || '',
                  format: 'CODE_128 (native)'
                });
              }
            }
          } catch (_) {}
        }

        if (!window.ZXing) return null;
        const hints = new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
        const reader = new ZXing.BrowserMultiFormatReader(hints);
        try {
          const result = await reader.decodeFromImageElement(img);
          if (!result) return null;
          return JSON.stringify({
            text: result.getText ? result.getText() : String(result),
            format: result.getBarcodeFormat ? String(result.getBarcodeFormat()) : 'CODE_128'
          });
        } catch (_) {
          return null;
        } finally {
          try { reader.reset(); } catch (_) {}
        }
      } catch (_) {
        return null;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
